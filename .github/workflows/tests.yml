name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas polars scikit-learn pytest ruff

      - name: Check Python syntax
        run: |
          python -m py_compile assignment2.py
          python -m py_compile test_churn_analysis.py

      - name: Run linting
        run: |
          ruff check assignment2.py test_churn_analysis.py

      - name: Run tests
        run: |
          pytest -v